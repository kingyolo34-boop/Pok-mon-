name: Build Fallen Ashe GBA (Cinderfall Art v2)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-fallen-ashe.yml"
      - "scripts/**"
      - "patches/**"
      - "assets/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Fallen Ashe scripts
        uses: actions/checkout@v4

      - name: Install the GBA ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils-arm-none-eabi gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libpng-dev python3 python3-pil

      - name: Fetch pinned Emerald Expansion source
        run: |
          git clone --no-checkout https://github.com/rh-hideout/pokeemerald-expansion.git expansion
          git -C expansion checkout be3b089fc121143b7ccf6503ea1385b8abe05b8c
          echo "Upstream commit: $(git -C expansion rev-parse HEAD)"

      - name: Apply Fallen Ashe starter source data
        run: |
          python3 scripts/apply_fallen_ashe.py expansion
          grep -E 'speciesName = _\("(Verdrake|Aqualye|Embergryph)"\)' \
            expansion/src/data/pokemon/species_info/gen_3_families.h

      - name: Apply Cinderfall story opening and Rook trainer battle
        run: |
          python3 scripts/apply_chapter1.py expansion
          grep -n 'trainerbattle_single TRAINER_FALLEN_ASHE_ROOK' expansion/data/maps/Route101/scripts.inc

      - name: Apply visible Fallen Ashe introduction and wasteland palette
        run: |
          python3 scripts/apply_visible_opening.py expansion
          grep -F 'POKéMON FALLEN ASHE' expansion/data/text/birch_speech.inc
          grep -F 'FALLEN ASHE' expansion/Makefile

      - name: Generate real Cinderfall town map and pixel tiles
        run: |
          python3 scripts/apply_cinderfall_map.py expansion
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("expansion")
          layout=next(x for x in json.loads((root/"data/layouts/layouts.json").read_text())["layouts"] if x["id"]=="LAYOUT_LITTLEROOT_TOWN")
          assert (layout["width"],layout["height"])==(28,29), layout
          assert (root/"data/layouts/LittlerootTown/map.bin").stat().st_size==28*29*2
          print("Cinderfall map validation OK: 28 x 29 tiles")
          PY

      - name: Add accessible Cinderfall interiors and verify walking paths
        run: |
          python3 scripts/apply_cinderfall_interiors.py expansion
          python3 - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path("expansion/data/maps/LittlerootTown/map.json").read_text())
          assert len(t["warp_events"]) == 7
          print("Validated seven two-way town entries")
          PY

      - name: Apply Cinderfall polished pixel-art tiles v2
        run: |
          python3 scripts/apply_cinderfall_polish_v2.py expansion
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path("expansion/data/tilesets/secondary/petalburg")
          i=Image.open(root/"tiles.png")
          assert i.size[0]==128
          assert (root/"palettes/12.pal").exists()
          print("Polished Cinderfall tiles:",i.size)
          PY

      - name: Compile a real native GBA ROM
        working-directory: expansion
        run: |
          make -j2 modern 2>&1 | tee ../gba-build.log
          test -s pokeemerald.gba

      - name: Check output ROM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom = Path("expansion/pokeemerald.gba").read_bytes()
          assert len(rom) >= 0xC0
          assert rom[0xB2] == 0x96
          assert rom[0xA0:0xAC].rstrip(b"\x00") == b"FALLEN ASHE", f"Wrong ROM title: {rom[0xA0:0xAC]!r}"
          expected = (-(sum(rom[0xA0:0xBD]) + 0x19)) & 0xFF
          assert rom[0xBD] == expected, "Bad GBA header checksum"
          print("ROM build OK:", len(rom), "bytes")
          PY

      - name: Upload playable test ROM
        uses: actions/upload-artifact@v4
        with:
          name: Fallen-Ashe-GBA-Cinderfall-Art-v2
          path: expansion/pokeemerald.gba
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiler log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Fallen-Ashe-Build-Diagnostics
          path: gba-build.log
          if-no-files-found: warn
          retention-days: 7
